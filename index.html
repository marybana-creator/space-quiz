<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 탐험 퀴즈</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#1d2036;--muted:#6b7090;--accent:#6c5ce7;--track:#e4e6f4;--ok:#22c55e;--okbg:#dcfce7;--bad:#ef4444;--badbg:#fee2e2;--border:#dfe2f2;--shadow:0 10px 30px rgba(60,60,120,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f1f;--card:#171a31;--text:#eceefc;--muted:#9a9fc4;--accent:#8b7dff;--track:#262a4b;--okbg:#12361f;--badbg:#431a1f;--border:#2a2e52;--shadow:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{width:100%;max-width:440px;background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);overflow:hidden}
h1{font-size:18px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.score{font-size:14px;font-weight:600;background:var(--track);padding:4px 12px;border-radius:99px;transition:transform .3s}
.score.pop{animation:pop .4s}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6c5ce7,#00cec9,#fd79a8);transition:width .5s ease}
.meta{font-size:13px;color:var(--muted);margin:8px 0 18px}
.q{font-size:16px;font-weight:600;margin:0 0 16px;min-height:52px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:12px 14px;border:2px solid var(--border);background:transparent;color:var(--text);border-radius:12px;cursor:pointer;transition:transform .15s,border-color .15s,background .2s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);animation:pulse .5s}
.opt.bad{background:var(--badbg);border-color:var(--bad);animation:shake .45s}
.fb{min-height:44px;margin:14px 0 4px;font-size:14px;color:var(--muted)}
.next,.restart{font:inherit;font-weight:600;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;transition:opacity .2s,transform .15s}
.next:hover,.restart:hover{transform:translateY(-1px)}
.next[hidden]{display:none}
.result{text-align:center;display:none;padding:12px 0}
.result .emoji{font-size:72px;animation:bounce 1s infinite}
.result .big{font-size:36px;font-weight:700;margin:6px 0}
.result p{color:var(--muted);margin:0 0 20px}
.done .quiz{display:none}.done .result{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes pop{50%{transform:scale(1.3);background:var(--okbg)}}
@keyframes bounce{50%{transform:translateY(-12px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.fade{animation:fade .35s}
</style>
</head>
<body>
<main id="app">
  <h1>🚀 우주 탐험 퀴즈 <span class="score" id="score">점수 0</span></h1>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" id="barwrap"><i id="bar"></i></div>
  <div class="quiz">
    <div class="meta" id="meta"></div>
    <div id="card" class="fade">
      <p class="q" id="q"></p>
      <div class="opts" id="opts"></div>
    </div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="next" id="next" hidden>다음 문제 →</button>
  </div>
  <div class="result">
    <div class="emoji" id="emoji"></div>
    <div class="big" id="final"></div>
    <p id="msg"></p>
    <button class="restart" id="restart">다시 도전하기</button>
  </div>
</main>
<script>
const Q=[
["태양계에서 가장 큰 행성은?",["목성","토성","지구","해왕성"],0,"목성은 지구 1,300배가 넘는 부피를 가졌어요."],
["인류 최초로 달에 발을 디딘 사람은?",["유리 가가린","닐 암스트롱","버즈 올드린","존 글렌"],1,"1969년 아폴로 11호의 닐 암스트롱입니다."],
["'붉은 행성'이라 불리는 것은?",["금성","수성","화성","천왕성"],2,"산화철 때문에 붉게 보여요."],
["태양빛이 지구에 도달하는 데 걸리는 시간은 약?",["8분","8초","8시간","1일"],0,"약 8분 20초 걸립니다."],
["최초의 인공위성 이름은?",["보이저 1호","스푸트니크 1호","아폴로 1호","허블"],1,"1957년 소련이 발사했어요."],
["고리가 가장 유명한 행성은?",["화성","금성","토성","수성"],2,"토성의 고리는 얼음과 암석 조각으로 이뤄져 있어요."],
["우리 은하의 이름은?",["안드로메다","은하수","마젤란","솜브레로"],1,"영어로는 Milky Way입니다."],
["우주에서 지구를 처음 본 한국인 우주인은?",["이소연","고산","박지성","유영"],0,"2008년 이소연 박사가 소유즈를 타고 갔어요."],
["태양계에서 가장 뜨거운 행성은?",["수성","금성","화성","목성"],1,"짙은 이산화탄소 대기의 온실효과 때문이에요."],
["허블 우주 망원경이 주로 관측하는 것은?",["지진","심해","먼 우주의 천체","날씨"],2,"1990년 발사되어 놀라운 우주 사진을 보내줬어요."]
];
const $=id=>document.getElementById(id);
let i=0,score=0,locked=false;
function render(){
  const [q,o,,]=Q[i];locked=false;
  $('meta').textContent=`문제 ${i+1} / ${Q.length}`;
  $('q').textContent=q;$('fb').textContent='';$('next').hidden=true;
  $('opts').innerHTML='';
  o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(k,b);$('opts').appendChild(b)});
  $('card').classList.remove('fade');void $('card').offsetWidth;$('card').classList.add('fade');
  setBar(i);
  if(i>0)$('opts').firstChild.focus();
}
document.addEventListener('keydown',e=>{
  const n=+e.key;
  if(n>=1&&n<=4&&!locked&&!$('app').classList.contains('done')){const b=$('opts').children[n-1];if(b)b.click()}
});
function setBar(n){$('bar').style.width=n/Q.length*100+'%';$('barwrap').setAttribute('aria-valuenow',n)}
function pick(k,btn){
  if(locked)return;locked=true;
  const [, ,a,exp]=Q[i],bs=[...$('opts').children];
  bs.forEach(b=>b.disabled=true);
  if(k===a){btn.classList.add('ok');score++;$('score').textContent='점수 '+score;$('score').classList.remove('pop');void $('score').offsetWidth;$('score').classList.add('pop');$('fb').innerHTML='🎉 <b style="color:var(--ok)">정답!</b> '+exp}
  else{btn.classList.add('bad');bs[a].classList.add('ok');$('fb').innerHTML='💥 <b style="color:var(--bad)">아쉬워요!</b> '+exp}
  $('next').textContent=i===Q.length-1?'결과 보기 🏁':'다음 문제 →';
  $('next').hidden=false;$('next').focus();setBar(i+1);
}
$('next').onclick=()=>{i++;i>=Q.length?finish():render()};
function finish(){
  setBar(Q.length);$('app').classList.add('done');
  const r=score/Q.length;
  const [e,m]=r===1?['🏆','완벽해요! 당신은 진정한 우주 비행사!']:r>=.8?['🚀','훌륭해요! 우주 탐험가 자격 충분!']:r>=.6?['🌟','좋아요! 조금만 더 탐험해 봐요.']:r>=.4?['🛰️','궤도에 진입했어요. 다시 도전!']:['🌑','아직 지구 근처예요. 다시 도전해 보세요!'];
  $('emoji').textContent=e;$('final').textContent=`${score} / ${Q.length}`;  $('msg').textContent=m;$('restart').focus();
}
$('restart').onclick=()=>{i=0;score=0;$('score').textContent='점수 0';$('app').classList.remove('done');render()};
render();
</script>
</body>
</html>
